<svg xmlns="http://www.w3.org/2000/svg" width="768" height="276" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Priyansh Jha product builder launch console</title>
  <desc id="desc">An animated product launch dashboard showing product, system, and delivery capabilities.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#12162a"/>
      <stop offset="1" stop-color="#0d1724"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#fda4af"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#94a3b8" stroke-opacity=".055"/>
    </pattern>
    <clipPath id="panelClip">
      <rect x="1" y="1" width="998" height="358" rx="22"/>
    </clipPath>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="998" height="358" rx="22" fill="url(#bg)" stroke="#303752"/>
  <rect x="1" y="1" width="998" height="358" rx="22" fill="url(#grid)"/>
  <g clip-path="url(#panelClip)">
    <rect x="0" y="0" width="1000" height="3" fill="url(#accent)"/>
    <rect x="0" y="54" width="1000" height="1" fill="#303752"/>
    <rect x="0" y="54" width="1000" height="44" fill="#c4b5fd" opacity=".025">
      <animate attributeName="y" values="54;315;54" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">
    <circle cx="30" cy="28" r="5" fill="#fda4af"/>
    <circle cx="48" cy="28" r="5" fill="#fde68a"/>
    <circle cx="66" cy="28" r="5" fill="#5eead4"/>
    <text x="88" y="33" fill="#94a3b8" font-size="13">launch-console / product-builder</text>
    <circle cx="867" cy="28" r="5" fill="#5eead4" filter="url(#softGlow)">
      <animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="882" y="33" fill="#99f6e4" font-size="12">AVAILABLE</text>

    <text x="45" y="100" fill="#94a3b8" font-size="12" letter-spacing="2">HELLO, I BUILD</text>
    <text x="45" y="148" fill="#f8fafc" font-size="39" font-weight="700">PRODUCTS PEOPLE</text>
    <text x="45" y="194" fill="#f8fafc" font-size="39" font-weight="700">KEEP USING.</text>

    <g font-size="17" font-weight="600">
      <text x="47" y="235" fill="#5eead4">DEVELOPER TOOLS
        <animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;.26;.33;.87;.94;1" dur="7.5s" repeatCount="indefinite"/>
      </text>
      <text x="47" y="235" fill="#c4b5fd" opacity="0">AI WORKFLOW SYSTEMS
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.27;.34;.59;.66;1" dur="7.5s" repeatCount="indefinite"/>
      </text>
      <text x="47" y="235" fill="#fda4af" opacity="0">FULL-STACK SaaS
        <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;.6;.66;.67;.92;1" dur="7.5s" repeatCount="indefinite"/>
      </text>
    </g>
    <rect x="45" y="253" width="386" height="5" rx="2.5" fill="#242b43"/>
    <rect x="45" y="253" width="386" height="5" rx="2.5" fill="url(#accent)">
      <animate attributeName="width" values="0;386;386;0" keyTimes="0;.72;.92;1" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <text x="45" y="292" fill="#94a3b8" font-size="12">from product decision to production system</text>
    <text x="45" y="320" fill="#64748b" font-size="11">PRIYANSH JHA / FULL-STACK PRODUCT ENGINEER</text>

    <g>
      <rect x="525" y="82" width="205" height="102" rx="15" fill="#151c31" stroke="#3b4566"/>
      <text x="546" y="108" fill="#5eead4" font-size="11" font-weight="700" letter-spacing="1.4">PRODUCT</text>
      <text x="546" y="137" fill="#e2e8f0" font-size="14">flows + interfaces</text>
      <text x="546" y="161" fill="#94a3b8" font-size="11">ambiguity -> clarity</text>
      <circle cx="701" cy="108" r="4" fill="#5eead4">
        <animate attributeName="r" values="3;6;3" dur="2.4s" repeatCount="indefinite"/>
      </circle>

      <rect x="748" y="82" width="205" height="102" rx="15" fill="#151c31" stroke="#3b4566"/>
      <text x="769" y="108" fill="#c4b5fd" font-size="11" font-weight="700" letter-spacing="1.4">SYSTEM</text>
      <text x="769" y="137" fill="#e2e8f0" font-size="14">APIs + data + jobs</text>
      <text x="769" y="161" fill="#94a3b8" font-size="11">designed to hold up</text>
      <circle cx="924" cy="108" r="4" fill="#c4b5fd">
        <animate attributeName="r" values="3;6;3" dur="2.4s" begin="-.8s" repeatCount="indefinite"/>
      </circle>

      <rect x="525" y="202" width="205" height="102" rx="15" fill="#151c31" stroke="#3b4566"/>
      <text x="546" y="228" fill="#fde68a" font-size="11" font-weight="700" letter-spacing="1.4">DELIVERY</text>
      <text x="546" y="257" fill="#e2e8f0" font-size="14">ship + observe</text>
      <text x="546" y="281" fill="#94a3b8" font-size="11">real releases, not demos</text>
      <circle cx="701" cy="228" r="4" fill="#fde68a">
        <animate attributeName="r" values="3;6;3" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
      </circle>

      <rect x="748" y="202" width="205" height="102" rx="15" fill="#151c31" stroke="#3b4566"/>
      <text x="769" y="228" fill="#fda4af" font-size="11" font-weight="700" letter-spacing="1.4">OWNERSHIP</text>
      <text x="769" y="257" fill="#e2e8f0" font-size="14">0 -> 1, end to end</text>
      <text x="769" y="281" fill="#94a3b8" font-size="11">product-minded by default</text>
      <circle cx="924" cy="228" r="4" fill="#fda4af">
        <animate attributeName="r" values="3;6;3" dur="2.4s" begin="-2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
