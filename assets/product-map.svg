<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Engineering approach map</title>
  <desc id="desc">A professional engineering process map from product context to system design, implementation, and iteration.</desc>
  <style>
    .heading { font: 800 24px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
    .body { font: 500 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
    .number { font: 800 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #38bdf8; letter-spacing: 1px; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset=".6" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="150" y1="150" x2="1050" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset=".5" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity=".24"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="298" rx="23" stroke="#1e293b" stroke-width="2"/>
  <path d="M150 150H1050" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="70" y="86" width="230" height="128" rx="18" fill="#020617" stroke="#1e293b"/>
    <text x="100" y="124" class="number">01</text>
    <text x="100" y="158" class="heading">Product Context</text>
    <text x="100" y="188" class="body">Clarify the workflow and user outcome.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="350" y="86" width="230" height="128" rx="18" fill="#020617" stroke="#1e293b"/>
    <text x="380" y="124" class="number">02</text>
    <text x="380" y="158" class="heading">System Design</text>
    <text x="380" y="188" class="body">Define data, APIs, and boundaries.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="630" y="86" width="230" height="128" rx="18" fill="#020617" stroke="#1e293b"/>
    <text x="660" y="124" class="number">03</text>
    <text x="660" y="158" class="heading">Implementation</text>
    <text x="660" y="188" class="body">Ship a reliable, maintainable version.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="910" y="86" width="230" height="128" rx="18" fill="#020617" stroke="#1e293b"/>
    <text x="940" y="124" class="number">04</text>
    <text x="940" y="158" class="heading">Iteration</text>
    <text x="940" y="188" class="body">Improve from usage and constraints.</text>
  </g>
</svg>
