<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Priyansh Jha professional profile banner</title>
  <desc id="desc">A professional dark banner for a full-stack product engineer.</desc>
  <style>
    .eyebrow { font: 700 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #38bdf8; letter-spacing: 2px; }
    .title { font: 800 58px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; letter-spacing: -1.4px; }
    .subtitle { font: 500 22px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
    .label { font: 700 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e0f2fe; letter-spacing: .4px; }
    .metric { font: 700 28px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
    .metricText { font: 600 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #94a3b8; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset=".55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="accent" x1="96" y1="94" x2="1104" y2="94" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset=".5" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="27" stroke="#1e293b" stroke-width="2"/>
  <path d="M96 92H1104" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <path d="M96 282H1104" stroke="#1e293b" stroke-width="1"/>

  <g opacity=".18">
    <path d="M150 130H1050M150 170H1050M150 210H1050M150 250H1050" stroke="#334155"/>
    <path d="M230 110V270M350 110V270M470 110V270M590 110V270M710 110V270M830 110V270M950 110V270" stroke="#334155"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="96" y="118" width="640" height="132" rx="20" fill="#020617" fill-opacity=".68" stroke="#1e293b"/>
    <text x="132" y="158" class="eyebrow">FULL-STACK PRODUCT ENGINEER</text>
    <text x="132" y="216" class="title">Priyansh Jha</text>
    <text x="132" y="246" class="subtitle">Building SaaS products, developer tools, and reliable backend systems.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="790" y="118" width="314" height="132" rx="20" fill="#020617" fill-opacity=".68" stroke="#1e293b"/>
    <text x="822" y="158" class="metric">Product</text>
    <text x="822" y="184" class="metricText">Interfaces and user workflows</text>
    <text x="822" y="216" class="metric">Systems</text>
    <text x="822" y="242" class="metricText">APIs, data models, queues</text>
  </g>

  <g transform="translate(96 300)">
    <rect width="142" height="34" rx="17" fill="#0f172a" stroke="#1d4ed8"/>
    <text x="20" y="22" class="label">TypeScript</text>
    <rect x="158" width="122" height="34" rx="17" fill="#0f172a" stroke="#0891b2"/>
    <text x="180" y="22" class="label">Next.js</text>
    <rect x="296" width="120" height="34" rx="17" fill="#0f172a" stroke="#0f766e"/>
    <text x="318" y="22" class="label">Node.js</text>
    <rect x="432" width="146" height="34" rx="17" fill="#0f172a" stroke="#475569"/>
    <text x="454" y="22" class="label">PostgreSQL</text>
  </g>
</svg>
