<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Priyansh Jha hero banner</title>
  <desc id="desc">A dark product engineering themed banner for Priyansh Jha.</desc>
  <style>
    .title { font: 800 60px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; letter-spacing: -1.5px; }
    .subtitle { font: 500 22px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #bae6fd; }
    .label { font: 700 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e0f2fe; letter-spacing: .5px; }
    .small { font: 600 13px "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #94a3b8; }
    .code { font: 600 16px "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #7dd3fc; }
    .glow-a { animation: pulseA 4s ease-in-out infinite; }
    .glow-b { animation: pulseB 5s ease-in-out infinite; }
    .float { animation: float 5s ease-in-out infinite; }
    @keyframes pulseA { 0%,100% { opacity: .38; } 50% { opacity: .85; } }
    @keyframes pulseB { 0%,100% { opacity: .2; } 50% { opacity: .65; } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="60" y1="0" x2="1120" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset=".45" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="line" x1="120" y1="80" x2="1080" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset=".5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <radialGradient id="orb1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(990 100) rotate(90) scale(180)">
      <stop stop-color="#38bdf8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(210 330) rotate(90) scale(170)">
      <stop stop-color="#7c3aed" stop-opacity=".42"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="34" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="418" rx="33" stroke="#1e293b" stroke-width="2"/>
  <circle class="glow-a" cx="990" cy="100" r="180" fill="url(#orb1)"/>
  <circle class="glow-b" cx="210" cy="330" r="170" fill="url(#orb2)"/>

  <path d="M70 320 C260 220 360 360 535 250 C710 140 770 280 920 176 C1015 110 1080 126 1135 92" stroke="url(#line)" stroke-width="3" opacity=".55"/>
  <path d="M80 80 H1120" stroke="#334155" stroke-width="1"/>
  <path d="M80 340 H1120" stroke="#334155" stroke-width="1"/>

  <g opacity=".28">
    <path d="M80 120H1120M80 160H1120M80 200H1120M80 240H1120M80 280H1120" stroke="#334155"/>
    <path d="M160 80V340M240 80V340M320 80V340M400 80V340M480 80V340M560 80V340M640 80V340M720 80V340M800 80V340M880 80V340M960 80V340M1040 80V340" stroke="#334155"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="78" y="96" width="610" height="238" rx="26" fill="#020617" fill-opacity=".72" stroke="#1e293b"/>
    <text x="112" y="158" class="small">PRODUCT ENGINEERING PROFILE</text>
    <text x="112" y="224" class="title">Priyansh Jha</text>
    <text x="114" y="264" class="subtitle">Full-stack engineer building SaaS,</text>
    <text x="114" y="292" class="subtitle">AI workflows, and developer tools.</text>
    <g transform="translate(112 306)">
      <rect width="142" height="34" rx="17" fill="#0f172a" stroke="#1d4ed8"/>
      <text x="18" y="22" class="label">UX + APIs</text>
      <rect x="158" width="164" height="34" rx="17" fill="#0f172a" stroke="#0891b2"/>
      <text x="178" y="22" class="label">DATA MODELS</text>
      <rect x="340" width="142" height="34" rx="17" fill="#0f172a" stroke="#7c3aed"/>
      <text x="360" y="22" class="label">AI TOOLS</text>
    </g>
  </g>

  <g class="float" filter="url(#shadow)">
    <rect x="765" y="104" width="315" height="212" rx="24" fill="#020617" fill-opacity=".8" stroke="#1e293b"/>
    <circle cx="794" cy="134" r="6" fill="#ef4444"/>
    <circle cx="816" cy="134" r="6" fill="#f59e0b"/>
    <circle cx="838" cy="134" r="6" fill="#22c55e"/>
    <text x="794" y="178" class="code">buildProduct({</text>
    <text x="826" y="210" class="code">taste: "clean",</text>
    <text x="826" y="242" class="code">backend: "solid",</text>
    <text x="826" y="274" class="code">ship: true</text>
    <text x="794" y="306" class="code">})</text>
  </g>
</svg>
